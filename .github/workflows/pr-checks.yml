# =====================================================================
# PR automation (Mini-Project Part-2, Sprint 1 items 2b-2d)
#
#   1. auto-assign : the PR author becomes the PR's assignee, so the board
#                    shows who raised it (2c: "the assigned team member raises the PR")
#   2. link check  : the PR description must reference a backlog issue:
#                       Closes #5        (merging closes the issue automatically)
#                    or Refs #5          (related work that does not finish an issue)
#                    The check fails, and leaves a comment explaining why, until it does.
#   3. size label  : size/S, size/M or size/L, so the reviewer can plan their time
#
# Review + merge by the repo owner (2d) is enforced by .github/CODEOWNERS and the
# branch protection rule on `main` (see CONTRIBUTING.md).
# =====================================================================
name: PR checks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  hygiene:
    name: Linked issue and assignee
    runs-on: ubuntu-latest
    steps:
      - name: Auto-assign the author
        if: github.event.pull_request.assignees[0] == null
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [context.payload.pull_request.user.login],
            });

      - name: Require a linked backlog issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            // GitHub's closing keywords (close/fix/resolve) or a plain reference (refs)
            const linked = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?)\s+#\d+/i.test(body);
            const marker = "<!-- pr-check:linked-issue -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number,
            });
            const previous = comments.find((c) => c.body.includes(marker));

            if (!linked) {
              if (!previous) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number,
                  body: `${marker}\n**This PR is not linked to a backlog item.**\n\n` +
                        "Add `Closes #<issue number>` to the description for every backlog " +
                        "issue this PR finishes (or `Refs #<n>` for supporting work).",
                });
              }
              core.setFailed("PR description must contain 'Closes #<issue>' or 'Refs #<issue>'");
            } else if (previous) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id,
              });
            }

  size:
    name: Size label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const changed = pr.additions + pr.deletions;
            const size = changed < 150 ? "size/S" : changed < 500 ? "size/M" : "size/L";
            const all = ["size/S", "size/M", "size/L"];
            for (const name of all.filter((n) => n !== size)) {
              if (pr.labels.some((l) => l.name === name)) {
                await github.rest.issues.removeLabel({ owner: context.repo.owner,
                  repo: context.repo.repo, issue_number: pr.number, name });
              }
            }
            // addLabels creates the label automatically the first time it is used
            await github.rest.issues.addLabels({ owner: context.repo.owner,
              repo: context.repo.repo, issue_number: pr.number, labels: [size] });
