<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Task Manager - create, organise and track your tasks">
  <title>Task Manager</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div id="toast" class="toast" hidden></div>

  <!-- ===================================================== AUTH VIEW (TMA-F-001..003) -->
  <main id="auth-view" class="auth" hidden>
    <section class="auth-card" aria-labelledby="auth-title">
      <h1 id="auth-title" class="brand">Task Manager</h1>
      <p class="auth-lede">Plan the week, keep the deadlines.</p>

      <div class="tabs" role="tablist" aria-label="Sign in or create an account">
        <button type="button" role="tab" id="tab-login" aria-selected="true"
                aria-controls="login-form">Log in</button>
        <button type="button" role="tab" id="tab-register" aria-selected="false"
                aria-controls="register-form">Create account</button>
      </div>

      <form id="login-form" class="stack" role="tabpanel" aria-labelledby="tab-login" novalidate>
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="email" required>
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password"
               autocomplete="current-password" required>
        <p class="form-error" id="login-error" role="alert"></p>
        <button class="btn primary" type="submit">Log in</button>
      </form>

      <form id="register-form" class="stack" role="tabpanel" aria-labelledby="tab-register"
            novalidate hidden>
        <label for="reg-name">Name</label>
        <input id="reg-name" name="name" autocomplete="name" maxlength="100" required>
        <label for="reg-email">Email</label>
        <input id="reg-email" name="email" type="email" autocomplete="email" required>
        <label for="reg-password">Password</label>
        <input id="reg-password" name="password" type="password" autocomplete="new-password"
               minlength="8" aria-describedby="reg-password-hint" required>
        <p class="hint" id="reg-password-hint">At least 8 characters, with a letter and a number.</p>
        <p class="form-error" id="register-error" role="alert"></p>
        <button class="btn primary" type="submit">Create account</button>
      </form>
    </section>
  </main>

  <!-- ===================================================== APP VIEW -->
  <div id="app-view" hidden>
    <header class="topbar">
      <span class="brand small">Task Manager</span>
      <nav class="top-actions" aria-label="Account">
        <span class="hint">Signed in as <span id="user-name"></span></span>
        <button type="button" class="btn ghost" id="btn-logout">Log out</button>
      </nav>
    </header>

    <main id="main" class="layout">
      <!-- --------------------------------------- Task list (TMA-F-010..014) -->
      <section class="tasks" aria-labelledby="tasks-title">
        <div class="tasks-head">
          <h2 id="tasks-title">Your tasks</h2>
          <button type="button" class="btn primary" id="btn-new-task">New task</button>
        </div>

        <p id="task-count" class="hint"></p>
        <ol id="task-list" class="task-list"></ol>
        <div id="empty-state" class="empty" hidden>
          <p>Nothing here yet. Add your first task to start planning.</p>
          <button type="button" class="btn primary" id="btn-empty-new">New task</button>
        </div>
      </section>
    </main>
  </div>

  <!-- ===================================================== TASK DIALOG -->
  <dialog id="task-dialog" aria-labelledby="task-dialog-title">
    <form id="task-form" class="stack" novalidate>
      <h2 id="task-dialog-title">New task</h2>
      <label for="t-title">Title</label>
      <input id="t-title" name="title" maxlength="200" required>
      <label for="t-description">Description <span class="hint">(optional)</span></label>
      <textarea id="t-description" name="description" rows="3" maxlength="2000"></textarea>
      <label for="t-priority">Priority</label>
      <select id="t-priority" name="priority">
        <option value="HIGH">High</option>
        <option value="MEDIUM" selected>Medium</option>
        <option value="LOW">Low</option>
      </select>
      <p class="form-error" id="task-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary" id="task-submit">Save task</button>
      </div>
    </form>
  </dialog>

  <!-- ===================================================== CONFIRM DELETE (TMA-F-012) -->
  <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <form method="dialog" class="stack">
      <h2 id="confirm-title">Delete task?</h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn ghost">Keep task</button>
        <button value="confirm" class="btn danger">Delete task</button>
      </div>
    </form>
  </dialog>
</body>
</html>
